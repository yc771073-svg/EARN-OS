name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - run: cp -r lib /tmp/lib_save && cp pubspec.yaml /tmp/pubspec_save.yaml
      - run: flutter create . --org com.earnos.app --project-name earn_os
      - run: rm -rf lib && cp -r /tmp/lib_save lib && cp /tmp/pubspec_save.yaml pubspec.yaml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: EARN-OS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.6-${{ github.run_number }}
          name: EARN OS V4.6 - Fix Android Manquant
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
