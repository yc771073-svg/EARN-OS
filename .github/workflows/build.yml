name: Build EARN OS APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release
      # On met le APK en Release, pas en ZIP, pour que Chrome ne bloque pas
      - name: Upload APK direct
        uses: actions/upload-artifact@v4
        with:
          name: EARN-OS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Create Release APK direct
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v3.5-${{ github.run_number }}
          name: EARN OS V3.5 - Sans Ma Boutique
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            EARN OS V3.5
            - Plus de Ma Boutique
            - Plus de Espace Marchand
            - Plus de Delivery visible - EARN OS gere en fond
            - Parametres en haut a gauche
            - 4 onglets seulement: Home | Explore | Cart | Profile
            - EARN AI en haut a droite comme Meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
